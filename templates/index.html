<!DOCTYPE html>
<html>
<head>
    <title>AI Resume & Portfolio Builder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">
    <h1>AI Resume & Portfolio Builder</h1>

   <form method="POST">
    <div class="row">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="text" name="education" placeholder="Education" required>
    </div>

    <div class="row">
        <input type="text" name="skills" placeholder="Skills (comma separated)" required>

        <select name="role" required>
            <option value="">Select Role</option>
            <option value="Software Developer">Software Developer</option>
            <option value="Data Analyst">Data Analyst</option>
            <option value="Core Engineer">Core Engineer</option>
            <option value="Internship">Internship</option>
        </select>
    </div>

    <textarea name="projects" placeholder="Projects" required></textarea>

    <button type="submit">Generate Resume</button>
     
</form>
   <script src="https://platform.linkedin.com/badges/js/profile.js" async defer></script>

<div class="badge-base LI-profile-badge"
data-locale="en_US"
data-size="medium"
data-theme="light"
data-type="HORIZONTAL"
data-vanity="abhishek-patel-94ab81328"
data-version="v1">
<a class="badge-base__link LI-simple-link"
href="https://in.linkedin.com/in/abhishek-patel-94ab81328">
Abhishek patel
</a>
</div>

{% if resume %}
<div class="output">
    <h2>Generated Resume</h2>
    <pre>{{ resume }}</pre>

    <form method="POST" action="/download">
        <input type="hidden" name="resume" value="{{ resume }}">
        <button type="submit">Download PDF</button>
    </form>
</div>
{% endif %}


</body>
</html>
